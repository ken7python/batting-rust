name: Build platforms

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.100.0
  CARGO_TERM_COLOR: always

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
          cargo fmt --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          ./build.sh web
          version="$(cargo metadata --locked --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="batting") | .version')"
          (cd dist/web && zip -q -r "../batting-web-v$version.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/batting-web-v*.zip
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin
          cargo test --locked --all-targets
          ./build.sh macos-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/macos/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          cargo test --locked --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          ./scripts/build-windows.ps1
          $Game = Start-Process -FilePath ./dist/windows/Batting.exe -PassThru
          try {
              $deadline = [DateTime]::UtcNow.AddSeconds(15)
              do {
                  Start-Sleep -Milliseconds 250
                  $Game.Refresh()
                  if ($Game.HasExited) { throw "Batting quit during startup ($($Game.ExitCode))" }
              } until ($Game.MainWindowHandle -ne 0 -or [DateTime]::UtcNow -gt $deadline)
              if ($Game.MainWindowHandle -eq 0) { throw 'Batting did not open a window' }
          }
          finally {
              if (!$Game.HasExited) { Stop-Process -Id $Game.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/windows/*.zip
          if-no-files-found: error

  ios:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target aarch64-apple-ios --target aarch64-apple-ios-sim
          ./build.sh ios-sim
          BATTING_IOS_UNSIGNED=1 ./build.sh ios-device
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' dist/ios/sim/Batting.app/Info.plist
          lipo -verify_arch arm64 dist/ios/sim/Batting.app/Batting
          lipo -verify_arch arm64 dist/ios/device/Batting.app/Batting
          ditto -c -k --keepParent dist/ios/sim/Batting.app dist/ios/batting-ios-simulator.zip
      - run: ./scripts/smoke-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: |
            dist/ios/batting-ios-simulator.zip
            dist/ios/*.png
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target x86_64-linux-android --target aarch64-linux-android
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;30.0.16248370' emulator 'system-images;android-35;google_apis;x86_64'
          ./build.sh android
      - run: |
          sudo chmod a+rw /dev/kvm
          ./scripts/smoke-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: |
            dist/android/batting-debug.apk
            dist/android/*.png
          if-no-files-found: error
