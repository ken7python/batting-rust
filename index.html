<!doctype html>
<html lang="ja">
<head>
  <base href="./play/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Batting Club</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png?v=64d9240287fd">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=71d3772433ac">
  <style>
    html { color-scheme: dark; }
    body { margin: 0; overflow: hidden; background: #0d2024; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; touch-action: none; }
    #start-error { position: fixed; inset: 24px auto auto 24px; padding: 16px; font: 16px system-ui; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="0" aria-label="Batting Club 3Dバッティングゲーム"></canvas>
  <p id="start-error" role="alert" hidden></p>
  <script src="./mq_js_bundle.js?v=d9f0916704ee"></script>
  <script>
    (() => {
      const canvas = document.getElementById("glcanvas");
      const error = document.getElementById("start-error");
      if (location.protocol === "file:" || typeof load !== "function") {
        error.textContent = location.protocol === "file:"
          ? "このゲームを開くには、Webサーバーから index.html を表示してください。"
          : "ゲームの読み込みに失敗しました。";
        error.hidden = false;
        return;
      }
      canvas.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "mouse" && event.button === 0) {
          canvas.setPointerCapture(event.pointerId);
        }
      });
      miniquad_add_plugin({
        name: "batting_display",
        version: 1,
        register_plugin(imports) {
          imports.env.batting_uses_mobile_layout = () =>
            window.matchMedia("(pointer: coarse)").matches ? 1 : 0;
        },
      });
      load("./batting.wasm?v=12d54d626379");
    })();
  </script>
</body>
</html>
